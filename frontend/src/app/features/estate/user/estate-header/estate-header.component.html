@if (activeEstateService.activeEstate()) {
  <div class="estate-header">
    <span class="estate-name">
      🏢 {{ activeEstateService.activeEstate()!.name }}
    </span>
    <button class="switch-btn" (click)="switchEstate()" title="Switch estate">
      {{ "ESTATE.SWITCH" | transloco }}
    </button>
  </div>
}
