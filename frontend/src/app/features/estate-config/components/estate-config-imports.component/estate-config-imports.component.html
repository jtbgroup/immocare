@if (canEdit) {
  <app-estate-config-section-wrapper
    [form]="form"
    [saveRequest]="saveTab"
    [canEdit]="canEdit"
  >
    <div class="imports-grid-container">
      <!-- Col Engine -->
      <div class="imports-column">
        <h3 class="imports-column-title">
          {{ "GLOBAL.BEHAVIOUR" | transloco }}
        </h3>
        <div class="imports-column-content">
          @for (item of IMPORTS_KEYS_ENGINE; track item) {
            <app-config-row
              [label]="getKeyI18NValue(item) | transloco"
              [id]="item"
              [control]="getControl(item)"
              [tooltip]="getKeyI18NValue(item) | transloco"
              [valueType]="getKeyValueType(item)"
              [min]="getMinIfExists(item)"
            />
          }
        </div>
      </div>

      <!-- Colonne Format -->
      <div class="imports-column">
        <h3 class="imports-column-title">{{ "GLOBAL.FORMAT" | transloco }}</h3>
        <div class="imports-column-content">
          @for (item of IMPORTS_KEYS_FORMAT; track item) {
            <app-config-row
              [label]="getKeyI18NValue(item) | transloco"
              [id]="item"
              [control]="getControl(item)"
              [tooltip]="getKeyI18NValue(item) | transloco"
              [valueType]="getKeyValueType(item)"
              [min]="getMinIfExists(item)"
            />
          }
        </div>
      </div>

      <!-- Col Columns mapping -->
      <div class="imports-column">
        <h3 class="imports-column-title">{{ "GLOBAL.COLUMNS" | transloco }}</h3>
        <div class="imports-column-content">
          @for (item of IMPORTS_KEYS_COLS; track item) {
            <app-config-row
              [label]="getKeyI18NValue(item) | transloco"
              [id]="item"
              [control]="getControl(item)"
              [tooltip]="getKeyI18NValue(item) | transloco"
              [valueType]="getKeyValueType(item)"
              [min]="getMinIfExists(item)"
            />
          }
        </div>
      </div>
    </div>
  </app-estate-config-section-wrapper>
}
