<form [formGroup]="form" (ngSubmit)="save()">
  <div class="settings-fields">
    @for (configKey of CONTRACTS_KEYS; track configKey) {
      <div class="form-group">
        <label [for]="configKey">
          {{ CONFIG_LABELS_I18N_KEYS[configKey] | transloco }}</label
        >
        <div class="input-with-unit">
          <input
            [id]="configKey"
            type="number"
            min="1"
            [formControlName]="toFormKey(configKey)"
          />
        </div>
        <label [for]="configKey">{{
          CONFIG_UNITS_I18N_KEYS[configKey] | transloco
        }}</label>
        @if (fieldError(configKey)) {
          <div class="field-error">
            {{ fieldError(configKey) }}
          </div>
        }
      </div>
    }
  </div>
  @if (canEdit) {
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{
          saving
            ? ("GLOBAL.SAVING" | transloco) + "..."
            : ("GLOBAL.SAVE" | transloco)
        }}
      </button>
    </div>
  }
</form>
