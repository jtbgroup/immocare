<div class="transactions-page">
  <div class="page-header">
    <h1>{{ "TRANSACTION.FINANCIAL_TRANSACTIONS" | transloco }}</h1>
  </div>

  <div
    class="transaction-tabs"
    role="tablist"
    [attr.aria-label]="'TRANSACTION.FINANCIAL_TRANSACTIONS' | transloco"
  >
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        class="transaction-tabs__tab"
        role="tab"
        [id]="'transaction-tab-' + tab.id"
        [class.transaction-tabs__tab--active]="activeTab === tab.id"
        [attr.aria-selected]="activeTab === tab.id"
        [attr.aria-controls]="'transaction-panel'"
        [attr.tabindex]="activeTab === tab.id ? 0 : -1"
        (click)="selectTab(tab.id)"
        (keydown)="onTabKeydown($event, tab.id)"
      >
        <span class="transaction-tabs__indicator" aria-hidden="true"></span>
        {{ tab.label | transloco }}
      </button>
    }
  </div>

  <div
    class="transaction-tabs__content"
    id="transaction-panel"
    role="tabpanel"
    [attr.aria-labelledby]="'transaction-tab-' + activeTab"
    tabindex="0"
  >
    @switch (activeTab) {
      @case ("dashboard") {
        <app-transaction-dashboard />
      }
      @case ("list") {
        <app-transaction-list />
      }
      @case ("import") {
        <app-transaction-import />
      }
    }
  </div>
</div>
